# shellcheck shell=bash disable=SC2034
# VDI-ImageMaint for Linux - built-in defaults. Do NOT edit: copy
# vdi-imagemaint.conf.example to vdi-imagemaint.conf and override there.

# --- general ---------------------------------------------------------------
VDI_LANG=""                       # en-US | pl-PL | empty = from $LANG
PROFILE="university"              # university | business (conf/profile-*.conf)
AUTO_UPGRADE="yes"                # yes | ask | no - upgrade the tool from GitHub releases at start

# --- locale / time ---------------------------------------------------------
LOCALES="en_US.UTF-8 pl_PL.UTF-8"
DEFAULT_LOCALE="pl_PL.UTF-8"
KEYBOARD_LAYOUT="pl"
TIMEZONE="Europe/Warsaw"
NTP_SERVERS=""                    # empty = AD_DOMAIN (DCs answer NTP; Kerberos needs <5 min skew)

# --- desktop ---------------------------------------------------------------
DESKTOP_PACKAGES="task-mate-desktop gdm3"   # MATE session, GDM display manager (Horizon SSO: gdm-hzncred)
BASE_PACKAGES="open-vm-tools open-vm-tools-desktop jq curl ca-certificates gnupg bind9-dnsutils dconf-cli locales console-setup"
EXTRA_PACKAGES=""
INSTALL_EDGE="no"                 # yes = Microsoft Edge from packages.microsoft.com (M365/Teams web)
SCREEN_LOCK_MINUTES=15            # 0 = no screen lock in the guest (Horizon client still locks)
BACKGROUND_COLOR="#1f3a5f"

# --- Active Directory (SSSD; the Horizon agent clones the join: OfflineJoinDomain=sssd)
AD_DOMAIN="ad.example.edu"
AD_REALM=""                       # empty = upper-case AD_DOMAIN
AD_WORKGROUP=""                   # NetBIOS domain name; empty = first label of AD_DOMAIN, upper-case
AD_JOIN_USER="join.example"
AD_COMPUTER_OU=""                 # e.g. OU=VDI-Linux,OU=Computers,DC=ad,DC=example,DC=edu
AD_ACCESS_GROUPS=""               # comma-separated; empty = access by AD GPO (permissive)
AD_SUDO_GROUPS=""                 # comma-separated AD groups with sudo on desktops
SSSD_ID_MAPPING="true"            # false = use uidNumber/gidNumber from AD (RFC2307) - must match the NFS server
SSSD_FQ_NAMES="false"             # true = user@domain logins (then SSO_USER_FORMAT="[username]@[domain]")
SSSD_DYNDNS="true"                # clones register their A record in AD DNS
MACHINE_PASSWORD_ROTATION="update" # update = rotated by "update" before the snapshot; off = never
MACHINE_PASSWORD_DAYS=25          # "update" rotates when the password is older than this (monthly cycle)
SSO_USER_FORMAT="[username]"      # [username] | [username]@[domain] | [domain]\[username]

# --- certificate logon: Horizon True SSO / smart card redirection --------------
TRUESSO_ENABLE="no"
SMARTCARD_ENABLE="no"
CERT_CA_FILES=""                  # PEM root/issuing CA(s) of logon certificates, in certs/ or absolute paths
SSSD_CERT_VERIFICATION=""         # empty = SSSD default (OCSP on); e.g. "no_ocsp" if clones cannot reach OCSP
KRB5_KDC=""                       # optional KDC for PKINIT (kdc + pkinit_kdc_hostname); empty = DNS SRV

# --- USB redirection (USB 3.0) + FIDO2 -------------------------------------------
USB_ENABLE="yes"                  # agent -U yes + USB VHCI kernel driver (DKMS)
VHCI_VERSION="1.15"
VHCI_URL="https://sourceforge.net/projects/usb-vhci/files/linux%20kernel%20module/vhci-hcd-1.15.tar.gz/download"
                                  # used only when Horizon/vhci-hcd-<version>.tar.gz is not present
FIDO_ENABLE="no"                  # FIDO2 keys work through USB redirection (forces USB_ENABLE)
FIDO_VIDPID=""                    # e.g. "m:vid-1050_pid-0407" -> viewusb.IncludeVidPid (KB 6001193)

# --- audio ----------------------------------------------------------------------
AUDIO_IN_ENABLE="yes"             # agent -a yes (microphone); audio-out is always on (pulseaudio-utils)

# --- NFS home directories (NFSv4 + Kerberos) ---------------------------------
NFS_ENABLE="yes"
NFS_SERVER="nfs.example.edu"
NFS_EXPORT="/export/home"         # <export>/<username> per user
NFS_SEC="krb5p"                   # krb5 | krb5i | krb5p
NFS_VERS="4.2"
NFS_OPTIONS="rw,hard,noatime"
NFS_IDMAP_DOMAIN=""               # empty = AD_DOMAIN; must match the server's idmapd Domain
HOME_ROOT="/nfshome"              # autofs mount point; users get HOME_ROOT/<username>
NFS_AUTOFS_TIMEOUT=600

# --- Horizon Linux Agent -------------------------------------------------------
HORIZON_AGENT_ARCHIVE=""          # empty = newest agent installer (.tar.gz or unpacked folder) in the source dirs
HORIZON_EXTRA_DIRS="/install"     # more folders with installers besides Horizon/ (images prepared by hand);
                                  # new installs keep everything in /opt/vdi-imagemaint/Horizon
# Flags are built from the settings: -A yes -M yes -a -U -T -m (documented options).
HORIZON_AGENT_EXTRA_ARGS=""       # more documented options, e.g. "--webcam" or "-C no -F no"
HORIZON_CS_FQDN=""                # Connection Server FQDN(s), space-separated - checked for DNS resolution

# --- Horizon Recording (mode "recording") ----------------------------------------
REC_ENABLE="no"
REC_SERVER_URL=""                 # https://<recording server>:9443
REC_USERNAME=""                   # password is asked for (or env VDI_REC_PASSWORD) - never stored
REC_THUMBPRINT=""                 # optional server certificate thumbprint (-s)
REC_ARCHIVE=""                    # empty = newest Horizon/Horizon.Recording.Linux.Agent-*.tar.gz
HORIZON_SSO="true"
RUNONCE_TIMEOUT=120
AGENT_EXTRA_SETTINGS=""           # space-separated Key=Value lines for viewagent-custom.conf

# --- Session Collaboration (mode "collab" asks for every value; these are the defaults offered)
COLLAB_ENABLE="true"
COLLAB_SERVER_URL=""              # link in invitations, e.g. https://uag.example.edu (UAG for external users)
COLLAB_EMAIL="true"               # invitations by e-mail
COLLAB_CONTROL_PASSING="true"     # collaborators may take keyboard/mouse control
COLLAB_MAX="5"                    # max collaborators per session

# --- "Courses" folder in the application menu / GNOME app grid (mode menu) -------
# Desktop file ids (*.desktop = exact) or parts of the file name, case-insensitive.
# Eclipse (vdi-eclipse.desktop) is added automatically when installed.
COURSES_APPS="octave gnumeric qtcreator code.desktop texmaker texstudio texdoctk"
COURSES_FOLDER_NAME="Courses"
COURSES_FOLDER_NAME_PL="Zajęcia"
COURSES_LOCK="yes"                # yes = users cannot remove the folder (lab pools)

# --- optimize (reversible: optimize --revert) ----------------------------------
OPTIMIZE_DISABLE_UNITS="bluetooth.service ModemManager.service avahi-daemon.service avahi-daemon.socket cups-browsed.service wpa_supplicant.service man-db.timer e2scrub_all.timer e2scrub_reap.service fstrim.timer plocate-updatedb.timer anacron.timer anacron.service fwupd-refresh.timer fwupd.service exim4.service rsyslog.service syslog.socket smartmontools.service switcheroo-control.service NetworkManager-wait-online.service"
OPTIMIZE_MASK_UNITS="sleep.target suspend.target hibernate.target hybrid-sleep.target"
OPTIMIZE_AUTOSTART_DISABLE="blueman print-applet geoclue-demo-agent"   # /etc/xdg/autostart/<name>.desktop
OPTIMIZE_SWAPPINESS=10
OPTIMIZE_JOURNAL_VOLATILE="yes"
OPTIMIZE_GRUB_TIMEOUT=1
OPTIMIZE_TMPFS_TMP="no"           # yes = /tmp in RAM (less clone disk I/O, costs RAM)
OPTIMIZE_IO_SCHEDULER="none"      # virtual disks: let the storage array schedule
OPTIMIZE_DENY_POWER="yes"         # users cannot shut down/reboot/suspend the clone (logoff refreshes it)

# --- update / seal ---------------------------------------------------------------
UPDATE_AGENTS="yes"               # update also upgrades Horizon/Recording agents when Horizon/ has newer archives
APT_HOLD_PACKAGES=""              # e.g. kernel meta-package while the agent is certified on an older kernel
SEAL_DISABLE_UNITS="apt-daily.timer apt-daily-upgrade.timer unattended-upgrades.service"
SEAL_MASK_UNITS="packagekit.service"   # D-Bus activated: disable alone does not stop it
SEAL_BLOCK_PACKAGES="yes"         # apt update / apt install / dpkg -i refused until unlock
SEAL_QUIET_USERS="yes"            # no package, colord or error pop-ups for desktop users
SEAL_RESET_SSH_KEYS="yes"         # host keys regenerated per clone by the RunOnce script
SEAL_POWEROFF="ask"               # ask | yes | no
