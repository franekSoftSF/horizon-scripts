# shellcheck shell=bash disable=SC2034
# Profile: business - knowledge workers, Microsoft 365 in the browser.
# Teams on a Linux Horizon desktop runs as a web app (Edge PWA): there is no
# Media Optimization for Teams in the Linux agent, so audio/video is not offloaded.
# Applied after defaults.conf and before the local vdi-imagemaint.conf (local wins).

EXTRA_PACKAGES="firefox-esr libreoffice libreoffice-l10n-pl hunspell-pl evince eom file-roller remmina"
INSTALL_EDGE="yes"
SCREEN_LOCK_MINUTES=15
SEAL_POWEROFF="ask"
COURSES_LOCK="no"
